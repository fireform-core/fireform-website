<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Vibrant Fire Gradient (No Black Background) -->
    <linearGradient id="fireBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b3d"/>
      <stop offset="45%" stop-color="#f95738"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Warm Highlight Glow on Top Edge -->
    <linearGradient id="topGlow" x1="256" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Hot Golden Core Flame -->
    <linearGradient id="goldCore" x1="256" y1="260" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop shadow for the flame symbol -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9f1239" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Smooth Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#fireBg)"/>
  
  <!-- Subtle Top Lighting Specular Accent -->
  <rect width="512" height="512" rx="128" fill="url(#topGlow)"/>

  <!-- Outer Flame (Crisp Pure White Silhouette) -->
  <g filter="url(#softGlow)">
    <path
      d="M266 76c12 52 42 88 80 124 44 42 66 90 66 148 0 86-70 156-156 156s-156-70-156-156c0-26 7-52 20-74 13-22 32-40 52-52 4 24 16 44 36 56 6-36 20-68 48-102 4-5 7-10 10-15z"
      fill="#ffffff"
    />
  </g>

  <!-- Inner Core Flame (Golden Amber Fire) -->
  <path
    d="M262 264c8 22 24 38 42 54 18 16 28 36 28 62 0 42-34 76-76 76s-76-34-76-76c0-14 4-28 11-40 6-10 16-18 25-24 2 12 8 22 18 28 3-18 10-34 22-50 2-4 4-7 6-10z"
    fill="url(#goldCore)"
  />
</svg>
